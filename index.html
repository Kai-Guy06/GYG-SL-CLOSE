<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=0.5">

<style>
html {margin: -10;padding: 0;}
body {
  background-image: url('background.png');
  background-color: rgba(255, 255, 255, 0.8);
  background-blend-mode: lighten;
  background-size: cover;
  text-align: center;
  align-content: center;
  font-size: 17px;
}
button {
  margin-top: 10;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  font-size: 20;
  width: 60%;
  height: 10%;
  background-color: rgb(255, 255, 255);
}
h1, h2 {
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  vertical-align:middle;
  padding-top: 25;
  width: 100%;
}
h2 {text-align: left;padding-left: 10;font-size: 20;padding-top: 0;}
.headingContainer {
  background: rgb(23, 23, 23);
  padding-top: 1px;
  height: 140;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  vertical-align: middle;
  width: 100%;
  margin-top: -300;
}
table, th, td, h2 {
  border-color: #2c2c2c;
  border-style: groove;
  border-width: 1px;
  border-collapse: collapse;
  margin-left: auto;
  margin-right: auto;
  color: #1a1a1a;
  width: 50%;

}
table {
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  margin-left: auto;
  margin-right: auto;
  width: 80%;
  font-size: 50;
}
input {box-sizing: border-box;width: 100%;font-size: 25;}
th {background: linear-gradient(90deg, #ffeb38, #f4ff96)}
tr {background-color: rgb(191, 208, 240);font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
</style>
<header class="headingContainer">
  <title>Money Counter</title>
  <div>
    <h1>Money Counting Tool</h1>
  </div>
</header>
</head>
<body>
  <p></p>
  <form>
    <table id="moneyTable">
      <tr><th>Denomination</th><th>Quantity</th></tr>
      <tr><td>5¢</td><td><input type="number" id="c5"></td></tr>
      <tr><td>10¢</td><td><input type="number" id="c10"></td></tr>
      <tr><td>20¢</td><td><input type="number" id="c20"></td></tr>
      <tr><td>50¢</td><td><input type="number" id="c50"></td></tr>
      <tr><td>$1</td><td><input type="number" id="d1"></td></tr>
      <tr><td>$2</td><td><input type="number" id="d2"></td></tr>
      <tr><td>$5</td><td><input type="number" id="d5"></td></tr>
      <tr><td>$10</td><td><input type="number" id="d10"></td></tr>
      <tr><td>$20</td><td><input type="number" id="d20"></td></tr>
      <tr><td>$50</td><td><input type="number" id="d50"></td></tr>
      <tr><td>$100</td><td><input type="number" id="d100"></td></tr>
    </table>
    <br>
    <button type="button" onclick="calculate()">Calculate</button>
  </form>

  <h2>Total: $<span id="total">0.00</span></h2>
  <h2>Difference from $350: <span id="difference">0.00</span></h2>
  <h2>Remove (largest denominations): <span id="removal"></span></h2>

<script>

function calculate() {
  const values = {
    c5: 0.05, c10: 0.10, c20: 0.20, c50: 0.50,
    d1: 1, d2: 2, d5: 5, d10: 10, d20: 20, d50: 50, d100: 100
  };
  let total = 0;
  let counts = [];
  for (let id in values) {
    total += document.getElementById(id).value * values[id];
    counts.push(Number(document.getElementById(id).value));
  }
  total = Math.round(total*100)/100;
  document.getElementById("total").innerText = total.toFixed(2);

  const diff = total - 350;
  document.getElementById("difference").innerText = diff.toFixed(2);

  if (diff <= 0) {
    document.getElementById("removal").innerText = "No removal needed.";
    return;
  }

  // Greedy removal using largest denominations
  let remaining = diff;
  const denoms = [100,50,20,10,5,2,1,0.5,0.2,0.1,0.05];
  let result = [];
  for (let j =0; j < denoms.length; j++) {
    let i = 10-j;
    d = denoms[j];
    let count = Math.floor((remaining) / d);
    if (count > 0 && counts[i] > 0) {
      if(counts[i] >= count){
        result.push(`${count} × $${d}`);
        remaining -= count * d;
      } else{
        result.push(`${counts[i]} x $${d}`);
        remaining -= counts[i] * d;
      }
      remaining = Math.round(remaining * 100) / 100;
      
    }
  }
  document.getElementById("removal").innerText = result.join(", ");
}
</script>
</body>
</html>
